<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Love Heart ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #060208;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    // Logical size (same as original)
    const LOGICAL = 800;
    let scale = 1;
    let offsetX = 0, offsetY = 0;

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      const w = window.innerWidth;
      const h = window.innerHeight;

      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Scale to fit while keeping aspect
      scale = Math.min(w, h) / LOGICAL * 0.95;
      offsetX = (w - LOGICAL * scale) / 2;
      offsetY = (h - LOGICAL * scale) / 2;
    }

    window.addEventListener('resize', resize);
    resize();

    // ====== Original parameters ======
    const SC = 21;
    const OY = 20;
    const DURATION = 9;
    const TICK = 16;
    const ANIM = 42;
    const LIFT = 34;
    const GAP = 7;
    const SIZES = [9, 10, 11, 12];
    const FONT = "Arial";
    const BG = "#060208";

    const PHRASES = [
      "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
      "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
      "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
      "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
      "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
    ];

    // Seeded random (same seed as original)
    function mulberry32(a) {
      return function() {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(11);

    function heart(a) {
      const x = 16 * Math.pow(Math.sin(a), 3);
      const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
      return [x * SC, y * SC + OY];
    }

    function hx(c) {
      return `#${c.map(v => Math.round(Math.max(0, Math.min(1, v)) * 255)
        .toString(16).padStart(2, '0')).join('')}`;
    }

    function mix(a, b, k) {
      return a.map((p, i) => p + (b[i] - p) * k);
    }

    function dim(c, k) {
      return c.map(v => v * k);
    }

    // Build heart polygon
    const POLY = [];
    for (let i = 0; i < 720; i++) {
      POLY.push(heart(2 * Math.PI * i / 720));
    }
    const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % POLY.length]]);
    const YMAX = Math.max(...POLY.map(p => p[1]));
    const YMIN = Math.min(...POLY.map(p => p[1]));
    const CY = (YMAX + YMIN) / 2;

    function spans(y) {
      const xs = [];
      for (const [[x1, y1], [x2, y2]] of EDGES) {
        if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
          xs.push(x1 + (y - y1) * (x2 - x1) / (y2 - y1));
        }
      }
      xs.sort((a, b) => a - b);
      const res = [];
      for (let i = 0; i < xs.length; i += 2) {
        if (i + 1 < xs.length) res.push([xs[i], xs[i + 1]]);
      }
      return res;
    }

    function intersect(A, B) {
      const out = [];
      for (const a of A) {
        for (const b of B) {
          const lo = Math.max(a[0], b[0]);
          const hi = Math.min(a[1], b[1]);
          if (hi - lo > 14) out.push([lo, hi]);
        }
      }
      return out;
    }

    const measureCache = {};
    function measure(text, size) {
      const key = text + "|" + size;
      if (measureCache[key]) return measureCache[key];
      ctx.font = `bold ${size}px ${FONT}`;
      const w = ctx.measureText(text).width;
      measureCache[key] = w;
      return w;
    }

    function phraseCycle() {
      let order = [...PHRASES];
      // shuffle once
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      let idx = 0;
      return function() {
        if (idx >= order.length) {
          // reshuffle
          for (let i = order.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [order[i], order[j]] = [order[j], order[i]];
          }
          idx = 0;
        }
        return order[idx++];
      };
    }

    function mathDist(x, y) {
      return Math.hypot(x / (16 * SC), (y - CY) / (14.5 * SC));
    }

    function build() {
      const nextPhrase = phraseCycle();
      const rowH = Math.max(...SIZES.map(s => s * 1.35)) + 4;
      const half = rowH / 2;
      const placed = [];

      let y = YMAX - half;
      while (y > YMIN + half) {
        const row = intersect(spans(y + half), spans(y - half));

        for (const [lo0, hi0] of row) {
          let lo = lo0 + 4;
          let hi = hi0 - 4;
          let cur = lo + rng() * 8;
          const line = [];

          while (true) {
            let fit = null;
            for (let tries = 0; tries < 12; tries++) {
              const text = nextPhrase();
              const size = SIZES[Math.floor(rng() * SIZES.length)];
              const w = measure(text, size);
              if (cur + w <= hi) {
                fit = { text, size, w };
                break;
              }
            }
            if (!fit) break;

            line.push({ x: cur + fit.w / 2, text: fit.text, size: fit.size, w: fit.w });
            cur += fit.w + GAP;
          }

          if (line.length === 0) continue;

          // Center the line inside the span
          if (line.length > 1) {
            const left = hi - (line[line.length - 1].x + line[line.length - 1].w / 2);
            line.forEach((it, i) => {
              it.x += left * i / (line.length - 1);
            });
          } else {
            line[0].x = (lo + hi) / 2;
          }

          line.forEach((it, i) => {
            const edge = i === 0 || i === line.length - 1;
            placed.push({
              x: it.x,
              y: y,
              text: it.text,
              size: it.size,
              edge
            });
          });
        }
        y -= rowH;
      }

      // Color grading (same as original)
      const wine = [0.58, 0.0, 0.09];
      const crimson = [0.90, 0.05, 0.14];
      const blood = [0.98, 0.10, 0.16];

      for (const p of placed) {
        const rad = Math.min(1.0, mathDist(p.x, p.y));
        let base = mix(wine, crimson, 0.25 + 0.75 * rad);
        base = mix(base, blood, rng() * 0.35 + (p.edge ? 0.3 : 0));
        p.color = base.map(v => Math.min(1, v));
        p.rad = rad;
      }

      const edges = placed.filter(p => p.edge);
      const inner = placed.filter(p => !p.edge);

      edges.sort((a, b) => {
        const aa = Math.atan2(a.x, a.y - CY);
        const bb = Math.atan2(b.x, b.y - CY);
        return ((aa % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) -
               ((bb % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      });
      inner.sort((a, b) => (-a.rad + rng() * 0.08) - (-b.rad + rng() * 0.08));

      return edges.concat(inner);
    }

    // ====== Animation ======
    const ORDER = build();
    let remaining = [...ORDER];
    const RATE = ORDER.length / (DURATION * 1000 / TICK);
    let acc = 0;
    let spawning = true;
    const active = [];
    const allItems = []; // keep finished ones for shimmer
    const FLASH = [1.0, 0.78, 0.78];
    const BGC = [0x06/255, 0x02/255, 0x08/255];

    function spawn(p) {
      p.f = 0;
      p.dx = (rng() - 0.5) * 20;
      p.alive = true;
      active.push(p);
      allItems.push(p);
    }

    function clamp(v) { return Math.max(0, Math.min(1, v)); }

    function animate(p) {
      p.f += 1;
      const u = clamp(p.f / ANIM);
      const e = 1 - Math.pow(1 - u, 3); // cubic ease-out

      const x = p.x;
      const y = -p.y;
      const hover = (1 - e) * LIFT;
      p.drawX = x + p.dx * (1 - e);
      p.drawY = y - hover;
      p.drawE = e;
      p.drawU = u;

      if (u >= 1) {
        p.drawX = x;
        p.drawY = y;
        p.alive = false;
        return false;
      }
      return true;
    }

    function draw() {
      // Clear full screen
      ctx.fillStyle = BG;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Move into the logical coordinate system
      ctx.save();
      ctx.translate(offsetX, offsetY);
      ctx.scale(scale, scale);

      // Center of logical canvas
      const cx = LOGICAL / 2;
      const cy = LOGICAL / 2;

      for (const p of allItems) {
        if (p.f === undefined) continue;

        const x = (p.drawX ?? p.x) + cx;
        const y = (p.drawY ?? -p.y) + cy;
        const e = p.drawE ?? 1;
        const u = p.drawU ?? 1;
        const c = p.color;

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Shadow
        ctx.font = `bold ${p.size}px ${FONT}`;
        ctx.fillStyle = hx(mix(BGC, dim(c, 0.30), e));
        ctx.fillText(p.text, x + 2, y + 3);

        // Halo
        ctx.font = `bold ${p.size + 1}px ${FONT}`;
        ctx.fillStyle = hx(mix(BGC, dim(c, 0.20), e * e));
        ctx.fillText(p.text, x, y);

        // Main text
        let col;
        if (u >= 1) {
          col = c;
        } else {
          const flash = 0.75 * Math.sin(Math.PI * clamp((u - 0.55) / 0.45));
          col = mix(mix(BGC, c, Math.pow(e, 1.5)), FLASH, flash);
        }

        ctx.font = `bold ${p.size}px ${FONT}`;
        ctx.fillStyle = hx(col);
        ctx.fillText(p.text, x, y);
      }

      ctx.restore();
    }

    let lastShimmer = 0;

    function step(now) {
      if (spawning) {
        acc += RATE;
        while (acc >= 1 && remaining.length) {
          acc -= 1;
          spawn(remaining.shift());
        }
        if (remaining.length === 0) spawning = false;
      }

      // Animate active ones
      for (let i = active.length - 1; i >= 0; i--) {
        if (!animate(active[i])) {
          active.splice(i, 1);
        }
      }

      draw();

      // Continuous shimmer after everything is placed
      if (!spawning && active.length === 0) {
        if (now - lastShimmer > 130) {
          lastShimmer = now;
          if (allItems.length) {
            const p = allItems[Math.floor(Math.random() * allItems.length)];
            const orig = p.color.slice();
            p.color = mix(orig, FLASH, 0.55);
            setTimeout(() => { p.color = orig; }, 240);
          }
        }
      }

      requestAnimationFrame(step);
    }

    // Start after a tiny delay so fonts are ready
    setTimeout(() => requestAnimationFrame(step), 100);
  </script>
</body>
</html>
